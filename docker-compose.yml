
services:

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: devflow-sql
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=YourStrong@123
    ports:
      - "1433:1433"
    volumes:
      - sql_data:/var/opt/mssql

  redis:
    image: redis:7
    container_name: devflow-redis
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management
    container_name: devflow-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"

volumes:
  sql_data: